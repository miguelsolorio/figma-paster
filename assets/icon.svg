<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Knocks the text lines out of the front page -->
    <mask id="lines">
      <rect x="16" y="40" width="72" height="72" rx="15" fill="#FFFFFF"/>
      <rect x="30" y="56" width="42" height="9" rx="4.5" fill="#000000"/>
      <rect x="30" y="72" width="34" height="9" rx="4.5" fill="#000000"/>
      <rect x="30" y="88" width="24" height="9" rx="4.5" fill="#000000"/>
    </mask>
    <!-- Cuts a gap out of the back page so the two pages never fuse -->
    <mask id="gap">
      <rect width="128" height="128" fill="#FFFFFF"/>
      <rect x="10" y="34" width="84" height="84" rx="21" fill="#000000"/>
    </mask>
  </defs>
  <g transform="translate(8 8) scale(0.875)">
    <rect x="40" y="16" width="72" height="72" rx="15" fill="none" stroke="#6EE7B7" stroke-width="10" mask="url(#gap)"/>
    <rect x="16" y="40" width="72" height="72" rx="15" fill="#059669" mask="url(#lines)"/>
  </g>
</svg>
